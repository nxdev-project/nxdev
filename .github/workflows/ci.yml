name: NXDev CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-native:
    name: Native Host Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build NXDev Host Binaries
        run: cmake --build build --config Release

      - name: Run Host Test Suite (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

  toolkit-vscode:
    name: VS Code Toolkit Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: toolkit/vscode/package.json

      - name: Install dependencies
        working-directory: toolkit/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: toolkit/vscode
        run: npm run compile

      - name: Run Linter
        working-directory: toolkit/vscode
        run: npm run lint

      - name: Run Extension Unit Tests
        working-directory: toolkit/vscode
        run: npm test

      - name: Test VSIX Packaging
        working-directory: toolkit/vscode
        run: npx @vscode/vsce package --no-git-tag-version --out nxdev-toolkit.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxdev-toolkit-vsix
          path: toolkit/vscode/nxdev-toolkit.vsix
